<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Meine To-Do Liste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
            background-color: #f4f4f4;
        }
        
        h1 {
            color: #333;
        }
        
        .todo {
            background: white;
            padding: 1em;
            margin-bottom: 1em;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        
        form {
            margin-top: 2em;
        }
        
        input[type="text"] {
            width: 80%;
            padding: 0.5em;
        }
        
        button {
            padding: 0.5em 1em;
            margin-left: 0.5em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Meine Aufgaben</h1>

    {% for todo in todos %}
    <div class="todo">
        <p>{{ todo.name }}</p>
        <form method="post" action="{% url 'delete_todo' todo.id %}">
            {% csrf_token %}
            <button type="submit">🗑️ Löschen</button>
        </form>
    </div>
    {% empty %}
    <p>Keine Aufgaben vorhanden.</p>
    {% endfor %}

    <h2>Neue Aufgabe</h2>
    <form method="post" action="{% url 'add_todo' %}">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Neue Aufgabe..." required>
        <button type="submit">➕ Hinzufügen</button>
    </form>
</body>

</html>
